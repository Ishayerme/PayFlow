# Serves the built dashboard and forwards API calls to the right service
# (same routing as frontend/vite.config.js in development).
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/api/accounts/\d+/statement { proxy_pass http://transaction-service:8082; }
    location /api/transfers                 { proxy_pass http://transaction-service:8082; }
    location /api/notifications             { proxy_pass http://notification-service:8083; }
    location /api/                          { proxy_pass http://account-service:8081; }

    location / { try_files $uri /index.html; }
}
