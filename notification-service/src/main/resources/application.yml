server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow_notifications}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

payflow:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-32-bytes-or-more}
  internal-key: ${INTERNAL_KEY:change-me-internal-service-key}
