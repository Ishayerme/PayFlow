# Whole PayFlow stack:  docker compose up --build   then open http://localhost:8080
# Secrets come from .env (copy .env.example). Never commit real secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      retries: 10

  account-service:
    build: { context: ., args: { SERVICE: account-service } }
    environment: &common-env
      DB_USERNAME: payflow
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_KEY: ${INTERNAL_KEY:?set INTERNAL_KEY in .env}
      DB_URL: jdbc:postgresql://postgres:5432/payflow_accounts
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@payflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }

  transaction-service:
    build: { context: ., args: { SERVICE: transaction-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/payflow_transactions
      ACCOUNT_SERVICE_URL: http://account-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/payflow_notifications
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [account-service, transaction-service, notification-service]

volumes:
  pgdata:
